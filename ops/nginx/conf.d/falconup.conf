# Docker's embedded DNS sits at 127.0.0.11. Using it (with valid=10s)
# tells nginx to re-resolve upstream hostnames every 10 seconds. Without
# this nginx caches the first IP it gets at config load, so any
# `docker compose up -d` that gives frontend/backend a new IP leaves
# nginx stuck pointing at the old one and we 502 until nginx itself
# is restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# Conditional WebSocket upgrade. Without this, an unconditional
# `Connection: upgrade` causes Next.js to reject normal HTTP requests
# with 502.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name falconup.julia7hk.com;

  access_log /var/log/nginx/falconup.access.log;
  error_log /var/log/nginx/falconup.error.log;

  gzip on;
  gzip_proxied any;
  gzip_comp_level 4;
  gzip_types text/css application/javascript image/svg+xml;

  # Variable-style targets are required for the `resolver` line above to
  # take effect — proxy_pass with a literal hostname is resolved exactly
  # once at config load.
  set $falconup_frontend "http://frontend:4040";
  set $falconup_backend  "http://backend:40401";

  # Better Auth — /api/auth/* → Next.js (not FastAPI)
  location /api/auth/ {
    proxy_pass $falconup_frontend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Cloudflare terminates TLS; nginx sees http on :80 but the real
    # client connection is https. Hardcode https so Better Auth sets
    # Secure cookies and generates correct redirect URLs.
    proxy_set_header X-Forwarded-Proto https;
  }

  # FastAPI — /api/*, /api/docs (OpenAPI), health
  location /api/ {
    proxy_pass $falconup_backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
  }

  # Everything else — Next.js
  location / {
    proxy_pass $falconup_frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_cache_bypass $http_upgrade;
    proxy_read_timeout 120;
    proxy_connect_timeout 120;
  }
}
