name: falconup-40
services:
  # One-shot DB migration. Runs `alembic upgrade head` and exits; the app
  # services wait for it to complete (service_completed_successfully) so they
  # never start against a schema older than the code.
  migrate:
    container_name: falconup-migrate
    image: ghcr.io/julia7hk/falconup26/backend:latest
    restart: "no"
    env_file:
      - ../.env
    command:
      - uv
      - run
      - alembic
      - upgrade
      - head
    networks:
      - falconup

  # nginx removed — the shared edge-proxy stack (~/_proj/edge-proxy) now owns
  # :80 and reverse-proxies falconup.julia7hk.com to falconup-backend /
  # falconup-frontend over the external `edge` network. falconup is now an
  # nginx-less backend stack that just joins `edge`. See edge-proxy/compose.yaml.

  backend:
    container_name: falconup-backend
    image: ghcr.io/julia7hk/falconup26/backend:latest
    restart: always
    env_file:
      - ../.env
    command:
      - uv
      - run
      - uvicorn
      - main:app
      - --host
      - "0.0.0.0"
      - --port
      - "40401"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - falconup
      - edge

  frontend:
    container_name: falconup-frontend
    image: ghcr.io/julia7hk/falconup26/frontend:latest
    restart: always
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - falconup
      - edge

networks:
  # Intra-app network: migrate ↔ backend ↔ frontend talk over this by service
  # name (frontend, backend). Kept so nothing about internal wiring changes.
  falconup:
    driver: bridge
  # Shared reverse-proxy network. edge-nginx reaches falconup-backend /
  # falconup-frontend by CONTAINER name here (short names `frontend`/`backend`
  # collide with the music stack on this network, so the .conf uses the unique
  # container names). Create once on the VM:  docker network create edge
  edge:
    external: true
